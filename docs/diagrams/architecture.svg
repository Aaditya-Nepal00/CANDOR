<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif">
  <defs>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1100" fill="#fafafa"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#1f2937" font-size="20" font-weight="700">CANDOR Architecture</text>
  <text x="500" y="60" text-anchor="middle" fill="#6b7280" font-size="13">How a forensic finding moves from raw evidence to a confidence-tagged report</text>

  <!-- LLM (pink, top) -->
  <g filter="url(#dropShadow)">
    <rect x="350" y="95" width="300" height="80" rx="12" fill="#fce7f3" stroke="#9d174d" stroke-width="2"/>
    <text x="500" y="128" text-anchor="middle" fill="#831843" font-size="16" font-weight="700">Claude Code (LLM)</text>
    <text x="500" y="150" text-anchor="middle" fill="#831843" font-size="12">Reads CLAUDE.md · investigates autonomously</text>
    <text x="500" y="166" text-anchor="middle" fill="#831843" font-size="11" font-style="italic">cannot run arbitrary commands</text>
  </g>

  <!-- Arrow LLM -> MCP -->
  <line x1="500" y1="180" x2="500" y2="215" stroke="#dc2626" stroke-width="3" marker-end="url(#redArrow)"/>
  <text x="515" y="201" fill="#dc2626" font-size="11" font-style="italic">MCP / stdio</text>

  <!-- Trust Boundary -->
  <g>
    <rect x="60" y="235" width="880" height="320" rx="14" fill="#fff" stroke="#dc2626" stroke-width="2" stroke-dasharray="8,5"/>
    <rect x="420" y="223" width="160" height="24" rx="4" fill="#fafafa"/>
    <text x="500" y="241" text-anchor="middle" fill="#dc2626" font-size="12" font-weight="700">TRUST BOUNDARY</text>
  </g>

  <!-- MCP Server (dark blue, central hub) -->
  <g filter="url(#dropShadow)">
    <rect x="340" y="265" width="320" height="80" rx="12" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="2"/>
    <text x="500" y="297" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">MCP Server</text>
    <text x="500" y="316" text-anchor="middle" fill="#dbeafe" font-size="11">mcp_server/server.py · 10 read-only tools</text>
    <text x="500" y="332" text-anchor="middle" fill="#bfdbfe" font-size="10" font-style="italic">SHA-256 hash before + after every call</text>
  </g>

  <!-- Evidence collection tools (yellow, spread below MCP) -->
  <g font-size="11" font-weight="600" fill="#78350f">
    <g filter="url(#dropShadow)">
      <rect x="85" y="395" width="120" height="50" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
      <text x="145" y="418" text-anchor="middle">get_amcache</text>
      <text x="145" y="434" text-anchor="middle" font-size="9" fill="#92400e" font-weight="400">registry hive</text>
    </g>
    <g filter="url(#dropShadow)">
      <rect x="220" y="395" width="120" height="50" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
      <text x="280" y="418" text-anchor="middle">get_prefetch</text>
      <text x="280" y="434" text-anchor="middle" font-size="9" fill="#92400e" font-weight="400">.pf execution</text>
    </g>
    <g filter="url(#dropShadow)">
      <rect x="355" y="395" width="120" height="50" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
      <text x="415" y="418" text-anchor="middle">get_mft</text>
      <text x="415" y="434" text-anchor="middle" font-size="9" fill="#92400e" font-weight="400">NTFS timeline</text>
    </g>
    <g filter="url(#dropShadow)">
      <rect x="525" y="395" width="120" height="50" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
      <text x="585" y="418" text-anchor="middle">get_evtx</text>
      <text x="585" y="434" text-anchor="middle" font-size="9" fill="#92400e" font-weight="400">event logs</text>
    </g>
    <g filter="url(#dropShadow)">
      <rect x="660" y="395" width="120" height="50" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
      <text x="720" y="418" text-anchor="middle">get_memory</text>
      <text x="720" y="434" text-anchor="middle" font-size="9" fill="#92400e" font-weight="400">Volatility3</text>
    </g>
    <g filter="url(#dropShadow)">
      <rect x="795" y="395" width="120" height="50" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
      <text x="855" y="418" text-anchor="middle">get_timeline</text>
      <text x="855" y="434" text-anchor="middle" font-size="9" fill="#92400e" font-weight="400">Plaso super</text>
    </g>
  </g>

  <!-- Arrows from MCP down to each evidence tool -->
  <line x1="400" y1="345" x2="155" y2="390" stroke="#dc2626" stroke-width="2" marker-end="url(#redArrow)"/>
  <line x1="430" y1="345" x2="285" y2="390" stroke="#dc2626" stroke-width="2" marker-end="url(#redArrow)"/>
  <line x1="465" y1="345" x2="415" y2="390" stroke="#dc2626" stroke-width="2" marker-end="url(#redArrow)"/>
  <line x1="535" y1="345" x2="585" y2="390" stroke="#dc2626" stroke-width="2" marker-end="url(#redArrow)"/>
  <line x1="570" y1="345" x2="720" y2="390" stroke="#dc2626" stroke-width="2" marker-end="url(#redArrow)"/>
  <line x1="605" y1="345" x2="855" y2="390" stroke="#dc2626" stroke-width="2" marker-end="url(#redArrow)"/>

  <!-- Section label for post-processing -->
  <text x="500" y="490" text-anchor="middle" fill="#6b7280" font-size="11" font-style="italic">findings flow into post-processing</text>

  <!-- Tagger (light blue) -->
  <g filter="url(#dropShadow)">
    <rect x="200" y="510" width="240" height="80" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="320" y="540" text-anchor="middle" fill="#1e3a8a" font-size="14" font-weight="700">Epistemic Tagger</text>
    <text x="320" y="558" text-anchor="middle" fill="#1e40af" font-size="11">agent/tagger.py</text>
    <text x="320" y="574" text-anchor="middle" fill="#1e40af" font-size="10" font-style="italic">keyword ladder + schema check</text>
  </g>

  <!-- Validators (light blue) -->
  <g filter="url(#dropShadow)">
    <rect x="560" y="510" width="240" height="80" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="680" y="540" text-anchor="middle" fill="#1e3a8a" font-size="14" font-weight="700">Schema Validators</text>
    <text x="680" y="558" text-anchor="middle" fill="#1e40af" font-size="11">agent/validators.py</text>
    <text x="680" y="574" text-anchor="middle" fill="#1e40af" font-size="10" font-style="italic">per-tool output structure</text>
  </g>

  <!-- Tagger <-> Validators line -->
  <line x1="440" y1="550" x2="557" y2="550" stroke="#dc2626" stroke-width="2" marker-end="url(#redArrow)"/>
  <line x1="557" y1="560" x2="443" y2="560" stroke="#dc2626" stroke-width="2" marker-end="url(#redArrow)"/>

  <!-- Confidence classes (4 small boxes below tagger) -->
  <g font-size="10" font-weight="700" fill="#fff">
    <g filter="url(#dropShadow)">
      <rect x="80" y="625" width="110" height="34" rx="8" fill="#238636"/>
      <text x="135" y="646" text-anchor="middle">CONFIRMED</text>
    </g>
    <g filter="url(#dropShadow)">
      <rect x="210" y="625" width="110" height="34" rx="8" fill="#9e6a03"/>
      <text x="265" y="646" text-anchor="middle">INFERRED</text>
    </g>
    <g filter="url(#dropShadow)">
      <rect x="340" y="625" width="110" height="34" rx="8" fill="#bd561d"/>
      <text x="395" y="646" text-anchor="middle">SUSPECTED</text>
    </g>
    <g filter="url(#dropShadow)">
      <rect x="470" y="625" width="110" height="34" rx="8" fill="#8e1519"/>
      <text x="525" y="646" text-anchor="middle">UNKNOWN</text>
    </g>
  </g>
  <text x="330" y="681" text-anchor="middle" fill="#6b7280" font-size="10" font-style="italic">every finding lands in one class · LLM can downgrade, never upgrade</text>

  <!-- Arrow from Tagger down to confidence -->
  <line x1="320" y1="595" x2="320" y2="620" stroke="#dc2626" stroke-width="2" marker-end="url(#redArrow)"/>

  <!-- Cross-Correlator (light blue) -->
  <g filter="url(#dropShadow)">
    <rect x="280" y="710" width="440" height="90" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="500" y="740" text-anchor="middle" fill="#1e3a8a" font-size="14" font-weight="700">Rule-Based Cross-Correlator</text>
    <text x="500" y="758" text-anchor="middle" fill="#1e40af" font-size="11">agent/correlator.py · 3 deterministic rules</text>
    <text x="350" y="780" fill="#1e40af" font-size="10">• timestamp proximity</text>
    <text x="500" y="780" text-anchor="middle" fill="#1e40af" font-size="10">• corroboration gaps</text>
    <text x="650" y="780" text-anchor="middle" fill="#1e40af" font-size="10">• known-bad patterns</text>
    <text x="500" y="795" text-anchor="middle" fill="#374151" font-size="10" font-style="italic">runs before LLM writes narrative</text>
  </g>

  <!-- Arrows from confidence -> correlator -->
  <line x1="450" y1="664" x2="490" y2="705" stroke="#dc2626" stroke-width="2" marker-end="url(#redArrow)"/>

  <!-- Arrow Correlator -> Reporter -->
  <line x1="500" y1="803" x2="500" y2="845" stroke="#dc2626" stroke-width="3" marker-end="url(#redArrow)"/>
  <text x="515" y="828" fill="#dc2626" font-size="11" font-style="italic">CorrelationReport</text>

  <!-- Reporter (yellow, output) -->
  <g filter="url(#dropShadow)">
    <rect x="320" y="855" width="360" height="80" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="500" y="887" text-anchor="middle" fill="#78350f" font-size="15" font-weight="700">HTML Report</text>
    <text x="500" y="905" text-anchor="middle" fill="#92400e" font-size="11">agent/reporter.py · self-contained, zero dependencies</text>
    <text x="500" y="922" text-anchor="middle" fill="#92400e" font-size="10" font-style="italic">color-coded confidence badges + dead-end advisories</text>
  </g>

  <!-- Footer note -->
  <g>
    <rect x="60" y="970" width="880" height="100" rx="12" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
    <text x="500" y="996" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="700">Why this architecture matters</text>
    <text x="80" y="1020" fill="#374151" font-size="11">• LLMs are bad at timestamp math — the Correlator does it deterministically before the LLM can write a single word of analysis.</text>
    <text x="80" y="1040" fill="#374151" font-size="11">• LLMs hallucinate gracefully — Schema Validators force structural checks on tool output, so a clean-looking lie gets downgraded.</text>
    <text x="80" y="1060" fill="#374151" font-size="11">• LLMs can't be trusted with shell access — the MCP Server exposes 10 typed read-only functions and hashes evidence on every call.</text>
  </g>
</svg>
